// Development build only. The production jar is built by build.sh / build.cmd with plain javac + jar.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'golden.update', System.getProperty('golden.update', 'false')
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'jmx2gatling.Main'
    }
}

tasks.named('check') {
    dependsOn ':compile-check:compileJava'
}
